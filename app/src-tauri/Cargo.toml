[package]
name = "kaleidoscope-app"
version = "0.6.3"
edition.workspace = true
license.workspace = true
publish.workspace = true

[lib]
name = "kaleidoscope_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[features]
e2e = ["dep:base64"]

[build-dependencies]
tauri-build = "2"

[dependencies]
kaleidoscope-orchestrator = { path = "../../crates/orchestrator" }
tauri = { version = "2", features = ["unstable"] }
kaleidoscope-core = { path = "../../crates/core" }
tauri-plugin-dialog = "2"
tauri-plugin-updater = "2"
tokio = { version = "1", features = ["time"] }
base64 = { version = "0.22", optional = true }
serde_json = { workspace = true }
dirs = "7"

[dev-dependencies]
serde_json = "1"

[target.'cfg(windows)'.dependencies]
webview2-com = "0.39.1"
windows = { version = "0.62.2", features = ["Win32_Foundation", "Win32_System_Com", "Win32_System_Com_StructuredStorage", "Win32_System_Threading", "Win32_Storage_FileSystem", "Win32_UI_WindowsAndMessaging"] }
