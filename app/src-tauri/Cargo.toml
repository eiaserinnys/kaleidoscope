[package]
name = "kaleidoscope-app"
version = "0.6.127"
edition.workspace = true
license.workspace = true
publish.workspace = true

[lib]
name = "kaleidoscope_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[features]
e2e = ["dep:reqwest", "dep:sha2", "dep:tokio-tungstenite", "kaleidoscope-core/e2e"]

[build-dependencies]
tauri-build = "2"

[dependencies]
tauri = { version = "2", features = ["unstable"] }
kaleidoscope-core = { path = "../../crates/core" }
tauri-plugin-dialog = "2"
tokio = { version = "1", features = ["time"] }
base64 = "0.22"
image = { version = "0.25", default-features = false, features = ["png"] }
serde_json = { workspace = true }
reqwest = { version = "0.12.4", default-features = false, features = ["blocking", "json", "rustls-tls"], optional = true }
sha2 = { version = "0.10", optional = true }
tokio-tungstenite = { version = "0.30", default-features = false, features = ["handshake"], optional = true }
percent-encoding = "2"
dirs = "7"

[dev-dependencies]
serde_json = "1"

# iPad는 원격 서버 전용이라 내장 오케스트레이터와 앱 업데이터를 싣지 않는다.
[target.'cfg(not(target_os = "ios"))'.dependencies]
kaleidoscope-orchestrator = { path = "../../crates/orchestrator" }
tauri-plugin-updater = "2"

# iPad에서만 메인 WKWebView의 스크롤 뷰 설정을 만진다. 데스크톱 빌드에는 들어가지 않는다.
[target.'cfg(target_os = "ios")'.dependencies]
objc2 = "0.6"
objc2-ui-kit = { version = "0.3", features = ["UIScrollView"] }
# 로그인 인가 주소를 앱 안의 Safari 시트로 열어 콜백 리스너가 도는 채로 둔다.
tauri-plugin-opener = "2.7.3"

[target.'cfg(windows)'.dependencies]
webview2-com = "0.39.1"
windows = { version = "0.62.2", features = ["Win32_Foundation", "Win32_Graphics_Dwm", "Win32_Graphics_Gdi", "Win32_System_Com", "Win32_System_Com_StructuredStorage", "Win32_System_Performance", "Win32_System_Threading", "Win32_Storage_FileSystem", "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_WindowsAndMessaging"] }
