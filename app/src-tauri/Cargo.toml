[package]
name = "kaleidoscope-app"
version = "0.3.2"
edition.workspace = true
license.workspace = true
publish.workspace = true

[lib]
name = "kaleidoscope_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = "2"

[dependencies]
tauri = { version = "2", features = ["unstable"] }
kaleidoscope-core = { path = "../../crates/core" }
tauri-plugin-dialog = "2"

[dev-dependencies]
serde_json = "1"

[target.'cfg(windows)'.dependencies]
webview2-com = "0.39.1"
windows = { version = "0.62.2", features = ["Win32_Foundation", "Win32_System_Com", "Win32_System_Com_StructuredStorage"] }
