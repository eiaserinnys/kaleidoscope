<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>Web control probe</title></head>
<body>
<button id="button">Probe button</button>
<label for="input">Probe input</label><input id="input">
<label for="choice">Probe choice</label><select id="choice"><option value="one">First</option><option value="two">Second</option></select>
<a href="#link">Probe link</a>
<p id="clicks">click-count 0</p>
<p id="inputs">input-count 0</p>
<p id="keys">enter-count 0</p>
<p id="partials">partial-count 0</p>
<p id="shadows">shadow-count 0</p>
<div id="shadow-host"></div>
<div style="height: 14px; overflow: hidden"><button id="partial">Partial button</button></div>
<div style="height: 14px; overflow: hidden"><button style="margin-top: 60px">Clipped button</button></div>
<div style="position: relative; width: 140px"><button>Covered button</button><div style="position: absolute; inset: 0; background: white"></div></div>
<div id="scroll" style="height: 80px; overflow: auto"><button id="scroll-target">Scroll target</button><div style="height: 500px"></div></div>
<script>
let clicks = 0, inputs = 0, keys = 0;
let partials = 0;
let shadows = 0;
const shadowRoot = document.querySelector('#shadow-host').attachShadow({mode: 'open'});
shadowRoot.innerHTML = '<button>Shadow button</button>';
shadowRoot.querySelector('button').addEventListener('click', () => { document.querySelector('#shadows').textContent = `shadow-count ${++shadows}`; });
document.querySelector('#partial').addEventListener('click', () => { document.querySelector('#partials').textContent = `partial-count ${++partials}`; });
document.querySelector('#button').addEventListener('click', () => { document.querySelector('#clicks').textContent = `click-count ${++clicks}`; });
document.querySelector('#input').addEventListener('input', () => { document.querySelector('#inputs').textContent = `input-count ${++inputs}`; });
document.addEventListener('keydown', event => { if (event.key === 'Enter') document.querySelector('#keys').textContent = `enter-count ${++keys}`; });
</script>
</body>
</html>
