[package]
name = "kaleidoscope-data"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
httpdate = "1"
kaleidoscope-contract = { path = "../contract" }
jsonata-core.workspace = true
serde_json.workspace = true
