[package]
name = "kaleidoscope-orchestrator"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
axum = "0.8"
base64 = "0.23"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
futures = "0.3"
kaleidoscope-contract = { path = "../contract" }
kaleidoscope-data = { path = "../data" }
rand = "0.10"
reqwest = { version = "0.12.4", default-features = false, features = ["json", "multipart", "rustls-tls", "stream"] }
mime_guess = "2"
process-wrap = { version = "10", features = ["tokio1", "job-object", "kill-on-drop", "creation-flags", "process-group"] }
rmcp = { version = "3.8", features = ["server", "macros", "transport-streamable-http-server"] }
rusqlite = { version = "0.41", features = ["bundled"] }
schemars = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
similar = "2"
subtle = "2"
tempfile = "3"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "signal", "net", "process", "io-util"] }
tokio-stream = { version = "0.1", features = ["sync"] }
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
http-body-util = "0.1"
tower = { version = "0.5", features = ["util"] }
