[package]
name = "kaleidoscope-core"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish.workspace = true

[features]
e2e = []

[dependencies]
axum = "0.8"
base64 = "0.22"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
dunce = "1"
kaleidoscope-contract = { path = "../contract" }
kaleidoscope-data = { path = "../data" }
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp", "gif"] }
futures-util = "0.3"
mime_guess = "2"
opener = { version = "0.9.0", features = ["reveal"] }
percent-encoding = "2"
process-wrap = { version = "10", features = ["tokio1", "job-object", "kill-on-drop", "creation-flags", "process-group"] }
reqwest = { version = "0.12.4", default-features = false, features = ["blocking", "gzip", "json", "rustls-tls", "stream"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
semver = "1"
sha2 = "0.10"
trash.workspace = true
tokio = { version = "1", features = ["rt", "time", "process", "io-util", "sync", "net", "fs"] }
tokio-util = { version = "0.7", features = ["compat"] }
tokio-tungstenite = { version = "0.30", default-features = false, features = ["connect", "handshake", "rustls-tls-webpki-roots"] }
which = "8"
uuid = { version = "1", features = ["v4"] }
url = "2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_System_Environment"] }
winreg = "0.56"

[target.'cfg(windows)'.dev-dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_System_Threading"] }

[dev-dependencies]
tempfile = "3"
kaleidoscope-orchestrator = { path = "../orchestrator" }
kaleidoscope-store-server = { path = "../store-server" }
reqwest = { version = "0.12.4", default-features = false, features = ["blocking", "multipart", "rustls-tls"] }
rusqlite = { version = "0.41", features = ["bundled"] }
tower = { version = "0.5", features = ["util"] }
