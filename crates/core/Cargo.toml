[package]
name = "kaleidoscope-core"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
base64 = "0.22"
agent-client-protocol = { version = "3.6", default-features = false }
chrono = { version = "0.4", default-features = false, features = ["clock"] }
kaleidoscope-contract = { path = "../contract" }
kaleidoscope-data = { path = "../data" }
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp", "gif"] }
mime_guess = "2"
opener = { version = "0.9.0", features = ["reveal"] }
percent-encoding = "2"
process-wrap = { version = "10", features = ["tokio1", "job-object", "kill-on-drop", "creation-flags", "process-group"] }
reqwest = { version = "0.12.4", default-features = false, features = ["blocking", "json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tokio = { version = "1", features = ["rt", "time", "process", "io-util", "sync"] }
tokio-util = { version = "0.7", features = ["compat"] }
which = "8"
uuid = { version = "1", features = ["v4"] }
url = "2"

[dev-dependencies]
tempfile = "3"
