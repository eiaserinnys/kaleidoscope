[workspace]
resolver = "2"
# Tauri 앱 크레이트(app/src-tauri)는 뼈대 작업(U0)에서 members에 더하고,
# default-members는 crates/만 남겨 `cargo test`가 웹뷰 스택을 빌드하지 않게 한다.
members = ["crates/*", "app/src-tauri"]
default-members = ["crates/*"]

[workspace.package]
edition = "2021"
license = "MIT"
publish = false

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ts-rs = { version = "12", features = ["serde-json-impl", "no-serde-warnings"] }
schemars = "1"
# 앱 정의의 JSONata 식. 계약(검사)과 코어, 오케스트레이터(계산)가 같은 엔진을 쓴다. simd는 끈다.
# 주의: 이 크레이트가 serde_json의 preserve_order를 켜서 작업 공간 전체의 JSON 객체가 넣은 순서를 지킨다.
jsonata-core = { version = "2.2.13", default-features = false }
