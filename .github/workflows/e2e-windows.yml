name: Windows WebView E2E
on:
  workflow_dispatch:
    inputs:
      ref:
        description: 시험할 브랜치 또는 커밋
        required: false
        type: string
  pull_request:
    paths:
      - '.github/workflows/e2e-windows.yml'
      - 'app/e2e-windows/**'
      - 'app/src-tauri/**'
      - 'crates/acp-test-agent/**'
      - 'crates/core/**'
      - 'crates/contract/**'
      - 'ui/e2e/fixtures/realtime/**'
      - 'Cargo.lock'

jobs:
  windows-e2e:
    runs-on: windows-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          # PR은 기본값(main과 합친 판)을 받는다. 워크플로 정의도 합친 판에서 읽히므로 코드와 시나리오가 어긋나지 않는다.
          ref: ${{ inputs.ref || '' }}
      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
        with:
          version: 10.32.1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
      - name: 테스트 ACP 에이전트 빌드
        run: cargo build -p kaleidoscope-acp-test-agent --release
      - run: pnpm install --frozen-lockfile
      - run: pnpm --dir app build
        env:
          VITE_KS_E2E: '1'
      - name: 실행 파일 캐시 복원
        id: executable-cache
        uses: actions/cache/restore@v4
        with:
          path: target/release/kaleidoscope-app.exe
          key: windows-webview-e2e-exe-${{ runner.os }}-${{ hashFiles('Cargo.lock', 'Cargo.toml', 'crates/**/*.rs', 'crates/**/Cargo.toml', 'app/src-tauri/**', 'app/src/**', 'app/index.html', 'app/package.json', 'ui/src/**', 'ui/package.json', 'ui/e2e/fixtures/realtime/**', 'pnpm-lock.yaml', 'examples/**', 'apps/**') }}
      - if: steps.executable-cache.outputs.cache-hit != 'true'
        run: cargo build -p kaleidoscope-app --release --features tauri/custom-protocol,e2e
      - name: 실행 파일 캐시 저장
        if: steps.executable-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: target/release/kaleidoscope-app.exe
          key: ${{ steps.executable-cache.outputs.cache-primary-key }}
      - name: 러너 창 내리기
        shell: pwsh
        run: |
          Add-Type -TypeDefinition @"
          using System;
          using System.Text;
          using System.Runtime.InteropServices;
          public class KsRunnerWindow {
            public delegate bool EnumWindowsProc(IntPtr hwnd, IntPtr lparam);
            [DllImport("user32.dll")] public static extern bool EnumWindows(EnumWindowsProc callback, IntPtr lparam);
            [DllImport("user32.dll")] public static extern bool IsWindowVisible(IntPtr hwnd);
            [DllImport("user32.dll", CharSet = CharSet.Unicode)] public static extern int GetClassName(IntPtr hwnd, StringBuilder text, int count);
            [DllImport("user32.dll", CharSet = CharSet.Unicode)] public static extern int GetWindowText(IntPtr hwnd, StringBuilder text, int count);
            [DllImport("user32.dll")] public static extern uint GetWindowThreadProcessId(IntPtr hwnd, out uint pid);
            [DllImport("user32.dll")] public static extern bool PostMessage(IntPtr hwnd, uint message, IntPtr wparam, IntPtr lparam);
          }
          "@
          function Get-RunnerWindow {
            $windows = New-Object System.Collections.Generic.List[object]
            $callback = [KsRunnerWindow+EnumWindowsProc]{
              param([IntPtr] $hwnd, [IntPtr] $lparam)
              if ([KsRunnerWindow]::IsWindowVisible($hwnd)) {
                $class = New-Object System.Text.StringBuilder 256
                [void][KsRunnerWindow]::GetClassName($hwnd, $class, 256)
                $title = New-Object System.Text.StringBuilder 1024
                [void][KsRunnerWindow]::GetWindowText($hwnd, $title, 1024)
                $owner = 0
                [void][KsRunnerWindow]::GetWindowThreadProcessId($hwnd, [ref]$owner)
                $windows.Add([pscustomobject]@{
                  Handle = $hwnd; Class = $class.ToString(); Title = $title.ToString(); ProcessId = [int]$owner
                })
              }
              return $true
            }
            [void][KsRunnerWindow]::EnumWindows($callback, [IntPtr]::Zero)
            return $windows
          }
          function Format-RunnerWindow($windows) {
            foreach ($window in $windows) {
              Write-Host ("window handle={0} pid={1} class={2} title={3}" -f $window.Handle, $window.ProcessId, $window.Class, $window.Title)
            }
          }
          # 이 스크립트를 돌리는 프로세스와 그 조상은 닫지 않는다.
          $ownProcess = New-Object System.Collections.Generic.HashSet[int]
          $current = $PID
          while ($current -and $ownProcess.Add([int]$current)) {
            $parent = (Get-CimInstance Win32_Process -Filter "ProcessId = $current" -ErrorAction SilentlyContinue).ParentProcessId
            if (-not $parent) { break }
            $current = [int]$parent
          }
          (New-Object -ComObject Shell.Application).MinimizeAll()
          Start-Sleep -Seconds 1
          $before = Get-RunnerWindow
          Format-RunnerWindow $before
          # 최소화되지 않고 남는 창(#32770 등)을 WM_CLOSE로 닫는다.
          # 작업 표시줄, 바탕 화면, 이 스크립트의 콘솔 창은 닫지 않는다.
          $keepClass = @(
            'Shell_TrayWnd', 'Shell_SecondaryTrayWnd', 'Progman', 'WorkerW', 'TaskListThumbnailWnd',
            'ConsoleWindowClass', 'CASCADIA_HOSTING_WINDOW_CLASS', 'PseudoConsoleWindow'
          )
          $closed = 0
          foreach ($window in $before) {
            if ($ownProcess.Contains($window.ProcessId)) { continue }
            if ($keepClass -contains $window.Class) { continue }
            [void][KsRunnerWindow]::PostMessage($window.Handle, 0x0010, [IntPtr]::Zero, [IntPtr]::Zero)
            $closed++
          }
          Start-Sleep -Milliseconds 200
          Write-Host ("closed {0} leftover windows" -f $closed)
          Format-RunnerWindow (Get-RunnerWindow)
      - name: 미디어 전송 실측 데이터 초기화
        shell: pwsh
        run: ./app/e2e-windows/reset-app-data.ps1
      - name: 실제 웹뷰 미디어 재생과 시킹
        shell: pwsh
        run: |
          $env:APPDATA = Join-Path $env:RUNNER_TEMP 'kaleidoscope-media-appdata'
          $env:LOCALAPPDATA = Join-Path $env:RUNNER_TEMP 'kaleidoscope-media-localappdata'
          $env:WEBVIEW2_USER_DATA_FOLDER = Join-Path $env:RUNNER_TEMP 'kaleidoscope-media-webview'
          $env:KALEIDOSCOPE_E2E_OUT = Join-Path $env:GITHUB_WORKSPACE 'windows-e2e/media-stream'
          $env:KALEIDOSCOPE_E2E_PICK_FOLDER = Join-Path $env:RUNNER_TEMP 'kaleidoscope-media-docs'
          New-Item -ItemType Directory -Force $env:APPDATA, $env:LOCALAPPDATA, $env:KALEIDOSCOPE_E2E_OUT, $env:KALEIDOSCOPE_E2E_PICK_FOLDER | Out-Null
          $appPath = Join-Path $env:GITHUB_WORKSPACE 'target/release/kaleidoscope-app.exe'
          $app = Start-Process -FilePath $appPath -ArgumentList @('--e2e-scenario=media-stream', "--e2e-out=$env:KALEIDOSCOPE_E2E_OUT") -RedirectStandardOutput (Join-Path $env:KALEIDOSCOPE_E2E_OUT 'stdout.log') -RedirectStandardError (Join-Path $env:KALEIDOSCOPE_E2E_OUT 'stderr.log') -PassThru
          try {
            if (-not $app.WaitForExit(120000)) { throw '미디어 실측 시간 초과' }
            $resultPath = Join-Path $env:KALEIDOSCOPE_E2E_OUT 'media-stream-results.json'
            if (Test-Path $resultPath) { Get-Content -Raw -Encoding utf8 $resultPath | Write-Host }
            if ($app.ExitCode -ne 0) { throw "미디어 실측 실패: $($app.ExitCode)" }
            if (-not (Test-Path $resultPath)) { throw '미디어 실측 결과 없음' }
            $result = Get-Content -Raw -Encoding utf8 $resultPath | ConvertFrom-Json
            if (-not $result.passed -or -not $result.webview.seeked -or -not $result.webview.progress -or -not $result.webview.unbuffered) { throw '재생과 버퍼 밖 시킹 확인 실패' }
            if (-not @($result.requests | Where-Object { $_[0] -eq 206 -and $_[1] -gt 0 -and $_[2] -eq 'http://tauri.localhost' }).Count) { throw '요청 출처와 0이 아닌 206 범위가 없음' }
          } finally {
            if (-not $app.HasExited) { Stop-Process -Id $app.Id -Force -ErrorAction SilentlyContinue }
            $app.Dispose()
          }
      - name: 웹 화면 DevTools 실측 데이터 초기화
        shell: pwsh
        run: ./app/e2e-windows/reset-app-data.ps1
      - name: 웹 화면 가시 조작점 시험
        run: node --test --test-timeout=60000 app/src-tauri/src/e2e/web_control_probe/visible-point.test.cjs
      - name: 웹 화면 DevTools 실측
        shell: pwsh
        run: |
          $env:APPDATA = Join-Path $env:RUNNER_TEMP 'kaleidoscope-web-control-appdata'
          $env:LOCALAPPDATA = Join-Path $env:RUNNER_TEMP 'kaleidoscope-web-control-localappdata'
          $env:WEBVIEW2_USER_DATA_FOLDER = Join-Path $env:RUNNER_TEMP 'kaleidoscope-web-control-webview'
          $env:KALEIDOSCOPE_E2E_OUT = Join-Path $env:GITHUB_WORKSPACE 'windows-e2e/web-control'
          $env:KALEIDOSCOPE_E2E_CAPTURE_SCRIPT = Join-Path $env:GITHUB_WORKSPACE 'app/e2e-windows/capture.ps1'
          $env:KALEIDOSCOPE_E2E_RECORDER_SCRIPT = Join-Path $env:GITHUB_WORKSPACE 'app/e2e-windows/freeze-record.ps1'
          New-Item -ItemType Directory -Force $env:APPDATA, $env:LOCALAPPDATA, $env:KALEIDOSCOPE_E2E_OUT | Out-Null
          $appPath = Join-Path $env:GITHUB_WORKSPACE 'target/release/kaleidoscope-app.exe'
          $app = Start-Process -FilePath $appPath -ArgumentList @('--e2e-scenario=web-control-probe', "--e2e-out=$env:KALEIDOSCOPE_E2E_OUT") -PassThru
          try {
            if (-not $app.WaitForExit(300000)) { throw '웹 화면 실측 시간 초과' }
            if ($app.ExitCode -ne 0) { throw "웹 화면 실측 실행 실패: $($app.ExitCode)" }
            $resultPath = Join-Path $env:KALEIDOSCOPE_E2E_OUT 'web-control-results.json'
            if (-not (Test-Path $resultPath)) { throw '웹 화면 실측 결과가 없음' }
            $result = Get-Content -Raw -Encoding utf8 $resultPath | ConvertFrom-Json
            foreach ($phase in @('a_visible', 'b_covered', 'c_hidden')) {
              if ($result.product.$phase.status -ne '된다') { throw "제품 웹 제어 실패: $phase $($result.product.$phase.detail | ConvertTo-Json -Compress -Depth 20)" }
              foreach ($field in @('ax', 'click', 'type', 'key', 'focus')) {
                if ($result.states.$phase.$field.status -notin @('된다', '안 된다', '측정 실패')) { throw "실측 결과 누락: $phase.$field" }
                Write-Host "$phase.$field : $($result.states.$phase.$field.status)"
              }
            }
            if ($result.product.c_hidden.flicker.status -ne '된다') { throw "숨김 웹뷰 제품 캡처 중 화면 변화: $($result.product.c_hidden.flicker | ConvertTo-Json -Compress -Depth 20)" }
            if ($null -ne $result.states.c_prime_cover) {
              foreach ($field in @('ax', 'click', 'type', 'key', 'focus', 'flicker')) {
                if ($result.states.c_prime_cover.$field.status -notin @('된다', '안 된다', '측정 실패')) { throw "덮개 실측 결과 누락: $field" }
                Write-Host "c_prime_cover.$field : $($result.states.c_prime_cover.$field.status)"
              }
            }
          } finally {
            if (-not $app.HasExited) { Stop-Process -Id $app.Id -Force -ErrorAction SilentlyContinue }
            $app.Dispose()
          }
      - name: 끌기 진단 자체 시험
        run: node --test --test-timeout=60000 app/e2e-windows/drag-events.test.cjs
      - name: 입력 미도달 재시도 정책 시험
        shell: pwsh
        run: |
          rustc --edition 2021 --test app/src-tauri/src/e2e/folder_drag/retry.rs -o "$env:RUNNER_TEMP/drag-retry-tests.exe"
          if ($LASTEXITCODE -ne 0) { throw '재시도 정책 시험 컴파일 실패' }
          & "$env:RUNNER_TEMP/drag-retry-tests.exe"
          if ($LASTEXITCODE -ne 0) { throw '재시도 정책 시험 실패' }
      - name: PC 접근 클릭 판정 시험
        shell: pwsh
        run: |
          rustc --edition 2021 --test app/src-tauri/src/e2e/ui/pc_access.rs -o "$env:RUNNER_TEMP/pc-access-tests.exe"
          if ($LASTEXITCODE -ne 0) { throw 'PC 접근 클릭 판정 시험 컴파일 실패' }
          & "$env:RUNNER_TEMP/pc-access-tests.exe"
          if ($LASTEXITCODE -ne 0) { throw 'PC 접근 클릭 판정 시험 실패' }
      - name: 탐색기 창 선택 자체 시험
        shell: pwsh
        run: ./app/e2e-windows/close-revealed-folder.ps1 -SelfTest
      - name: 실제 웹뷰 시나리오 데이터 초기화
        shell: pwsh
        run: ./app/e2e-windows/reset-app-data.ps1
      - name: 실제 웹뷰 시나리오
        shell: pwsh
        run: |
          $env:APPDATA = Join-Path $env:RUNNER_TEMP 'kaleidoscope-e2e-appdata'
          $env:LOCALAPPDATA = Join-Path $env:RUNNER_TEMP 'kaleidoscope-e2e-localappdata'
          $env:KALEIDOSCOPE_E2E_OUT = Join-Path $env:GITHUB_WORKSPACE 'windows-e2e'
          $env:KALEIDOSCOPE_E2E_PICK_FOLDER = Join-Path $env:RUNNER_TEMP 'kaleidoscope-e2e-docs'
          New-Item -ItemType Directory -Force $env:APPDATA, $env:LOCALAPPDATA, $env:KALEIDOSCOPE_E2E_OUT, $env:KALEIDOSCOPE_E2E_PICK_FOLDER | Out-Null
          $notes = Join-Path $env:KALEIDOSCOPE_E2E_PICK_FOLDER 'notes'
          New-Item -ItemType Directory -Force $notes | Out-Null
          Set-Content -Encoding utf8 (Join-Path $notes 'a.md') '# 첫 번째 노트'
          Set-Content -Encoding utf8 (Join-Path $notes 'b.md') '# 두 번째 노트'
          Set-Content -Encoding utf8 (Join-Path $notes 'todo.txt') '할 일'
          $env:WEBVIEW2_USER_DATA_FOLDER = Join-Path $env:RUNNER_TEMP 'kaleidoscope-e2e-webview'
          $app = Start-Process -FilePath (Join-Path $env:GITHUB_WORKSPACE 'target/release/kaleidoscope-app.exe') -PassThru
          try {
            $captured = @{}
            $requiredCaptures = @('01-example-com', '03-hidden', '04-ui-live', '05-menu-frozen', '06-menu-closed', '07-editor-overlap', '08-web-raised', '08-pc-icons', '09-a-md', '10-b-md', '11-address')
            $deadline = (Get-Date).AddMinutes(4)
            while ((Get-Date) -lt $deadline) {
              foreach ($name in ($requiredCaptures + @('99-ui-failure'))) {
                $request = Join-Path $env:KALEIDOSCOPE_E2E_OUT "$name.request"
                if ((Test-Path $request) -and -not $captured.ContainsKey($name)) {
                  $destination = Join-Path $env:KALEIDOSCOPE_E2E_OUT "$name.png"
                  $capture = Start-Process powershell.exe -ArgumentList @('-NoProfile', '-ExecutionPolicy', 'Bypass', '-File', (Join-Path $env:GITHUB_WORKSPACE 'app/e2e-windows/capture.ps1'), $destination) -WindowStyle Hidden -Wait -PassThru
                  if ($capture.ExitCode -ne 0) { throw "화면 캡처 실패: $name" }
                  New-Item -ItemType File (Join-Path $env:KALEIDOSCOPE_E2E_OUT "$name.done") | Out-Null
                  $captured[$name] = $true
                }
              }
              $app.Refresh()
              if ($app.HasExited) { break }
              Start-Sleep -Milliseconds 200
            }
            $app.Refresh()
            if (-not $app.HasExited) { throw 'E2E 시나리오 시간 초과' }
            if ($app.ExitCode -ne 0) { throw "E2E 실패: $($app.ExitCode)" }
            foreach ($name in $requiredCaptures) {
              if (-not $captured.ContainsKey($name)) { throw "화면 캡처 요청이 누락됨: $name" }
            }
            $events = Get-Content (Join-Path $env:KALEIDOSCOPE_E2E_OUT 'events.jsonl') | ForEach-Object { $_ | ConvertFrom-Json }
            if (-not ($events | Where-Object { $_.step -eq 'complete' })) { throw 'E2E 완료 로그가 없음' }
          } finally {
            Stop-Process -Id $app.Id -Force -ErrorAction SilentlyContinue
            if (-not $app.WaitForExit(10000)) { throw '시나리오 앱 종료 시간 초과' }
            $app.Dispose()
          }
      - name: 파일 쓰기 명령 시나리오 데이터 초기화
        shell: pwsh
        run: ./app/e2e-windows/reset-app-data.ps1
      - name: 파일 쓰기 명령 시나리오
        shell: pwsh
        run: |
          $env:APPDATA = Join-Path $env:RUNNER_TEMP 'kaleidoscope-files-write-appdata'
          $env:LOCALAPPDATA = Join-Path $env:RUNNER_TEMP 'kaleidoscope-files-write-localappdata'
          $env:KALEIDOSCOPE_E2E_OUT = Join-Path $env:GITHUB_WORKSPACE 'windows-e2e/files-write'
          $env:KALEIDOSCOPE_E2E_PICK_FOLDER = Join-Path $env:RUNNER_TEMP 'kaleidoscope-files-write-docs'
          $env:WEBVIEW2_USER_DATA_FOLDER = Join-Path $env:RUNNER_TEMP 'kaleidoscope-files-write-webview'
          New-Item -ItemType Directory -Force $env:APPDATA, $env:LOCALAPPDATA, $env:KALEIDOSCOPE_E2E_OUT, $env:KALEIDOSCOPE_E2E_PICK_FOLDER | Out-Null
          $appPath = Join-Path $env:GITHUB_WORKSPACE 'target/release/kaleidoscope-app.exe'
          $app = Start-Process -FilePath $appPath -ArgumentList @('--e2e-scenario=files-write', "--e2e-out=$env:KALEIDOSCOPE_E2E_OUT") -PassThru
          try {
            $deadline = (Get-Date).AddMinutes(2)
            while ((Get-Date) -lt $deadline) {
              $app.Refresh()
              if ($app.HasExited) { break }
              Start-Sleep -Milliseconds 200
            }
            $app.Refresh()
            if (-not $app.HasExited) { throw '파일 쓰기 E2E 시간 초과' }
            $eventPath = Join-Path $env:KALEIDOSCOPE_E2E_OUT 'events.jsonl'
            $events = Get-Content $eventPath | ForEach-Object { $_ | ConvertFrom-Json }
            $failures = @()
            if ($app.ExitCode -ne 0) { $failures += "파일 쓰기 E2E 실패: $($app.ExitCode)" }
            foreach ($step in @('files-write.external-drop-guard', 'files-write.case-only-rename', 'files-write.file-busy-recovery', 'files-write.trash', 'files-write.reveal', 'files-write.drag', 'complete')) {
              $check = $events | Where-Object { $_.step -eq $step } | Select-Object -Last 1
              if (-not $check -or $check.data.passed -eq $false) { $failures += "파일 쓰기 단계 실패 또는 누락: $step" }
            }
            if ($failures.Count -gt 0) { throw ($failures -join '; ') }
          } finally {
            Stop-Process -Id $app.Id -Force -ErrorAction SilentlyContinue
            if (-not $app.WaitForExit(10000)) { throw '파일 쓰기 앱 종료 시간 초과' }
            $app.Dispose()
            ./app/e2e-windows/close-revealed-folder.ps1 -Folder $env:KALEIDOSCOPE_E2E_PICK_FOLDER -EventsPath (Join-Path $env:KALEIDOSCOPE_E2E_OUT 'events.jsonl')
          }
      - name: 같이 보기 격리 캡처 시나리오 데이터 초기화
        shell: pwsh
        run: ./app/e2e-windows/reset-app-data.ps1
      - name: 같이 보기 격리 캡처 시나리오
        shell: pwsh
        run: |
          $env:APPDATA = Join-Path $env:RUNNER_TEMP 'kaleidoscope-share-isolate-appdata'
          $env:LOCALAPPDATA = Join-Path $env:RUNNER_TEMP 'kaleidoscope-share-isolate-localappdata'
          $env:KALEIDOSCOPE_E2E_OUT = Join-Path $env:GITHUB_WORKSPACE 'windows-e2e/share-isolate'
          $env:KALEIDOSCOPE_E2E_PICK_FOLDER = Join-Path $env:RUNNER_TEMP 'ks share isolate work'
          $env:KALEIDOSCOPE_E2E_AGENT_BIN = Join-Path $env:RUNNER_TEMP 'ks share isolate bin'
          $env:WEBVIEW2_USER_DATA_FOLDER = Join-Path $env:RUNNER_TEMP 'kaleidoscope-share-isolate-webview'
          New-Item -ItemType Directory -Force $env:APPDATA, $env:LOCALAPPDATA, $env:KALEIDOSCOPE_E2E_OUT, $env:KALEIDOSCOPE_E2E_PICK_FOLDER, $env:KALEIDOSCOPE_E2E_AGENT_BIN | Out-Null
          Copy-Item (Join-Path $env:GITHUB_WORKSPACE 'target/release/kaleidoscope-acp-test-agent.exe') (Join-Path $env:KALEIDOSCOPE_E2E_AGENT_BIN 'kaleidoscope-acp-test-agent.exe')
          @('@echo off', '"%~dp0kaleidoscope-acp-test-agent.exe" %*') | Set-Content -Encoding Ascii (Join-Path $env:KALEIDOSCOPE_E2E_AGENT_BIN 'fake-agent.cmd')
          $env:PATH = "$env:KALEIDOSCOPE_E2E_AGENT_BIN;$env:PATH"
          $recorderPath = Join-Path $env:GITHUB_WORKSPACE 'app/e2e-windows/freeze-record.ps1'
          & powershell.exe -NoProfile -ExecutionPolicy Bypass -File $recorderPath -SelfTest
          if ($LASTEXITCODE -ne 0) { throw '화면 녹화 상태 읽기 자체 시험 실패' }
          $recorder = Start-Process powershell.exe -ArgumentList @('-NoProfile', '-ExecutionPolicy', 'Bypass', '-File', $recorderPath, $env:KALEIDOSCOPE_E2E_OUT) -WindowStyle Hidden -PassThru
          $appPath = Join-Path $env:GITHUB_WORKSPACE 'target/release/kaleidoscope-app.exe'
          $app = Start-Process -FilePath $appPath -ArgumentList @('--e2e-scenario=share-isolate', "--e2e-out=$env:KALEIDOSCOPE_E2E_OUT") -PassThru
          try {
            $deadline = (Get-Date).AddMinutes(10)
            while ((Get-Date) -lt $deadline) {
              $app.Refresh()
              if ($app.HasExited) { break }
              Start-Sleep -Milliseconds 200
            }
            $app.Refresh()
            if (-not $app.HasExited) { throw '같이 보기 격리 캡처 E2E 시간 초과' }
            $appExitCode = $app.ExitCode
            if (-not $recorder.WaitForExit(15000)) { throw '화면 녹화 프로세스가 끝나지 않음' }
            if ($recorder.ExitCode -ne 0) { throw "화면 녹화 실패: $($recorder.ExitCode)" }
            $eventPath = Join-Path $env:KALEIDOSCOPE_E2E_OUT 'events.jsonl'
            $events = Get-Content $eventPath | ForEach-Object { $_ | ConvertFrom-Json }
            $results = @($events | Where-Object { $_.step -eq 'check.result' })
            $required = @('1-covered-b', '1-covered-agent', '2-minimized', '3-web-covered', '3-web-minimized', '4-both-covered', '5-flicker', '6-focus', '7-watchdog', '8-visible')
            foreach ($id in $required) {
              $check = @($results | Where-Object { $_.data.id -eq $id })
              if ($check.Count -ne 1) { throw "검사 결과 누락 또는 중복: $id" }
              Write-Host "$id : $($check[0].data.ok) $($check[0].data.message)"
            }
            $frames = Import-Csv (Join-Path $env:KALEIDOSCOPE_E2E_OUT 'screen-frames.csv')
            $measuredPhases = @('a-covered-by-b', 'a-covered-by-agent', 'a-minimized', 'web-covered', 'web-minimized', 'both-covered', 'a-visible')
            foreach ($phase in $measuredPhases) {
              $phaseFrames = @($frames | Where-Object { $_.phase -eq $phase })
              if ($phaseFrames.Count -eq 0) { throw "화면 프레임 누락: $phase" }
              if (@($phaseFrames | Where-Object { [int]$_.protected_pixels -ne 0 }).Count -gt 0) { throw "보호 화면 영역이 바뀜: $phase" }
            }
            if ($appExitCode -ne 0 -or @($results | Where-Object { -not $_.data.ok }).Count -gt 0) { throw "같이 보기 격리 캡처 E2E 실패: $appExitCode" }

          } finally {
            Stop-Process -Id $app.Id -Force -ErrorAction SilentlyContinue
            Stop-Process -Id $recorder.Id -Force -ErrorAction SilentlyContinue
          }
      - name: 같이 보지 않는 창의 커멘트 캡처
        shell: pwsh
        run: |
          rustc --edition 2021 --test app/src-tauri/src/e2e/share_isolate/comment_capture/pixels.rs -o "$env:RUNNER_TEMP/comment-pixels.exe"
          if ($LASTEXITCODE -ne 0) { throw '커멘트 픽셀 판정 시험 컴파일 실패' }
          & "$env:RUNNER_TEMP/comment-pixels.exe"
          if ($LASTEXITCODE -ne 0) { throw '커멘트 픽셀 판정 자체 시험 실패' }
          ./app/e2e-windows/reset-app-data.ps1
          $env:APPDATA = Join-Path $env:RUNNER_TEMP 'kaleidoscope-comment-capture-appdata'
          $env:LOCALAPPDATA = Join-Path $env:RUNNER_TEMP 'kaleidoscope-comment-capture-localappdata'
          $env:WEBVIEW2_USER_DATA_FOLDER = Join-Path $env:RUNNER_TEMP 'kaleidoscope-comment-capture-webview'
          $env:KALEIDOSCOPE_E2E_OUT = Join-Path $env:GITHUB_WORKSPACE 'windows-e2e/comment-capture'
          New-Item -ItemType Directory -Force $env:APPDATA, $env:LOCALAPPDATA, $env:KALEIDOSCOPE_E2E_OUT | Out-Null
          $recorderPath = Join-Path $env:GITHUB_WORKSPACE 'app/e2e-windows/freeze-record.ps1'
          $recorder = Start-Process powershell.exe -ArgumentList @('-NoProfile', '-ExecutionPolicy', 'Bypass', '-File', $recorderPath, $env:KALEIDOSCOPE_E2E_OUT) -WindowStyle Hidden -PassThru
          $appPath = Join-Path $env:GITHUB_WORKSPACE 'target/release/kaleidoscope-app.exe'
          $app = Start-Process -FilePath $appPath -ArgumentList @('--e2e-scenario=comment-capture', "--e2e-out=$env:KALEIDOSCOPE_E2E_OUT") -PassThru
          try {
            if (-not $app.WaitForExit(180000)) { throw '커멘트 캡처 E2E 시간 초과' }
            if ($app.ExitCode -ne 0) { throw "커멘트 캡처 E2E 실패: $($app.ExitCode)" }
            if (-not $recorder.WaitForExit(15000) -or $recorder.ExitCode -ne 0) { throw '커멘트 캡처 화면 기록 실패' }
            $events = Get-Content (Join-Path $env:KALEIDOSCOPE_E2E_OUT 'events.jsonl') | ForEach-Object { $_ | ConvertFrom-Json }
            foreach ($id in @('comment-capture', 'comment-flicker', 'comment-web-lease')) {
              $checks = @($events | Where-Object { $_.step -eq 'check.result' -and $_.data.id -eq $id -and $_.data.ok })
              if ($checks.Count -ne 1) { throw "커멘트 캡처 검사 누락: $id" }
            }
          } finally {
            Stop-Process -Id $app.Id -Force -ErrorAction SilentlyContinue
            Stop-Process -Id $recorder.Id -Force -ErrorAction SilentlyContinue
          }
      - name: 클라이언트 HTTP 판정 자체 시험
        shell: pwsh
        run: |
          rustc --edition 2021 --test app/src-tauri/src/e2e/client_http/checks.rs -o "$env:RUNNER_TEMP/client-http-checks.exe"
          if ($LASTEXITCODE -ne 0) { throw '클라이언트 HTTP 판정 시험 컴파일 실패' }
          & "$env:RUNNER_TEMP/client-http-checks.exe"
          if ($LASTEXITCODE -ne 0) { throw '클라이언트 HTTP 판정 시험 실패' }
      - name: 클라이언트 HTTP 시나리오 데이터 초기화
        shell: pwsh
        run: ./app/e2e-windows/reset-app-data.ps1
      - name: 클라이언트 HTTP 시나리오
        shell: pwsh
        run: |
          $env:APPDATA = Join-Path $env:RUNNER_TEMP 'kaleidoscope-client-http-appdata'
          $env:LOCALAPPDATA = Join-Path $env:RUNNER_TEMP 'kaleidoscope-client-http-localappdata'
          $env:KALEIDOSCOPE_E2E_OUT = Join-Path $env:GITHUB_WORKSPACE 'windows-e2e/client-http'
          $env:WEBVIEW2_USER_DATA_FOLDER = Join-Path $env:RUNNER_TEMP 'kaleidoscope-client-http-webview'
          New-Item -ItemType Directory -Force $env:APPDATA, $env:LOCALAPPDATA, $env:KALEIDOSCOPE_E2E_OUT | Out-Null
          $appPath = Join-Path $env:GITHUB_WORKSPACE 'target/release/kaleidoscope-app.exe'
          $app = Start-Process -FilePath $appPath -ArgumentList @('--e2e-scenario=client-http', "--e2e-out=$env:KALEIDOSCOPE_E2E_OUT") -PassThru
          try {
            if (-not $app.WaitForExit(240000)) { throw '클라이언트 HTTP E2E 시간 초과' }
            $eventsPath = Join-Path $env:KALEIDOSCOPE_E2E_OUT 'events.jsonl'
            if (-not (Test-Path $eventsPath)) { throw '클라이언트 HTTP 이벤트 파일 누락' }
            $events = @(Get-Content $eventsPath | ForEach-Object { $_ | ConvertFrom-Json })
            foreach ($event in $events) { Write-Host "$($event.step) : $($event.data | ConvertTo-Json -Compress)" }
            if ($app.ExitCode -ne 0) { throw "클라이언트 HTTP E2E 실패: $($app.ExitCode)" }
            foreach ($step in @('client-http.result', 'complete')) {
              $matches = @($events | Where-Object { $_.step -eq $step })
              if ($matches.Count -ne 1) { throw "클라이언트 HTTP 검사 누락 또는 중복: $step" }
            }
          } finally {
            Stop-Process -Id $app.Id -Force -ErrorAction SilentlyContinue
            if (-not $app.WaitForExit(10000)) { throw '클라이언트 HTTP 앱 종료 시간 초과' }
            $app.Dispose()
          }
      - name: 실시간 연결 판정 자체 시험
        shell: pwsh
        run: |
          rustc --edition 2021 --test app/src-tauri/src/e2e/realtime/checks.rs -o "$env:RUNNER_TEMP/realtime-checks.exe"
          if ($LASTEXITCODE -ne 0) { throw '실시간 판정 시험 컴파일 실패' }
          & "$env:RUNNER_TEMP/realtime-checks.exe"
          if ($LASTEXITCODE -ne 0) { throw '실시간 판정 시험 실패' }
      - name: 실시간 연결 시나리오 데이터 초기화
        shell: pwsh
        run: ./app/e2e-windows/reset-app-data.ps1
      - name: 실시간 연결 시나리오
        shell: pwsh
        run: |
          $env:APPDATA = Join-Path $env:RUNNER_TEMP 'kaleidoscope-realtime-appdata'
          $env:LOCALAPPDATA = Join-Path $env:RUNNER_TEMP 'kaleidoscope-realtime-localappdata'
          $env:KALEIDOSCOPE_E2E_OUT = Join-Path $env:GITHUB_WORKSPACE 'windows-e2e/realtime'
          $env:WEBVIEW2_USER_DATA_FOLDER = Join-Path $env:RUNNER_TEMP 'kaleidoscope-realtime-webview'
          # Tauri는 APPDATA 환경변수 대신 Known Folder 경로를 읽는다(reset-app-data.ps1과 같다).
          $config = Get-Content ./app/src-tauri/tauri.conf.json | ConvertFrom-Json
          $dataDir = Join-Path ([Environment]::GetFolderPath('ApplicationData')) $config.identifier
          New-Item -ItemType Directory -Force $dataDir, $env:LOCALAPPDATA, $env:KALEIDOSCOPE_E2E_OUT | Out-Null
          # 로그인 경로는 로컬 Chromium 시험이 맡고, 여기서는 격리된 시험 토큰만 넣는다.
          '{"fixture-echo":{"issuer":"http://127.0.0.1","access_token":"fixture-secret"}}' | Set-Content -Encoding utf8NoBOM (Join-Path $dataDir 'logins.json')
          $appPath = Join-Path $env:GITHUB_WORKSPACE 'target/release/kaleidoscope-app.exe'
          $app = Start-Process -FilePath $appPath -ArgumentList @('--e2e-scenario=realtime', "--e2e-out=$env:KALEIDOSCOPE_E2E_OUT") -PassThru
          try {
            $captured = @{}
            $deadline = (Get-Date).AddMinutes(3)
            while ((Get-Date) -lt $deadline) {
              foreach ($name in @('01-realtime', '99-realtime-failure')) {
                $request = Join-Path $env:KALEIDOSCOPE_E2E_OUT "$name.request"
                if ((Test-Path $request) -and -not $captured.ContainsKey($name)) {
                  $destination = Join-Path $env:KALEIDOSCOPE_E2E_OUT "$name.png"
                  & powershell.exe -NoProfile -ExecutionPolicy Bypass -File ./app/e2e-windows/capture.ps1 $destination
                  if ($LASTEXITCODE -ne 0) { throw "실시간 화면 캡처 실패: $name" }
                  New-Item -ItemType File (Join-Path $env:KALEIDOSCOPE_E2E_OUT "$name.done") | Out-Null
                  $captured[$name] = $true
                }
              }
              $app.Refresh()
              if ($app.HasExited) { break }
              Start-Sleep -Milliseconds 200
            }
            $app.Refresh()
            if (-not $app.HasExited) { throw '실시간 연결 E2E 시간 초과' }
            $events = @(Get-Content (Join-Path $env:KALEIDOSCOPE_E2E_OUT 'events.jsonl') | ForEach-Object { $_ | ConvertFrom-Json })
            foreach ($step in @('realtime.roundtrip', 'realtime.csp', 'realtime.minimized', 'realtime.restored', 'realtime.reload', 'complete')) {
              $check = @($events | Where-Object { $_.step -eq $step })
              if ($check.Count -ne 1) { throw "실시간 검사 누락 또는 중복: $step" }
              Write-Host "$step : $($check[0].data | ConvertTo-Json -Compress)"
            }
            if ($app.ExitCode -ne 0) { throw "실시간 연결 E2E 실패: $($app.ExitCode)" }
            if (-not $captured.ContainsKey('01-realtime')) { throw '실시간 연결 캡처 누락' }
          } finally {
            Stop-Process -Id $app.Id -Force -ErrorAction SilentlyContinue
            if (-not $app.WaitForExit(10000)) { throw '실시간 앱 종료 시간 초과' }
            $app.Dispose()
          }
      - name: 네이티브 쉘 단축키 판정 자체 시험
        if: ${{ !cancelled() }}
        shell: pwsh
        run: |
          rustc --edition 2021 --test app/src-tauri/src/e2e/shell_shortcuts/checks.rs -o "$env:RUNNER_TEMP/shortcut-checks.exe"
          if ($LASTEXITCODE -ne 0) { throw '단축키 판정 시험 컴파일 실패' }
          & "$env:RUNNER_TEMP/shortcut-checks.exe"
          if ($LASTEXITCODE -ne 0) { throw '단축키 판정 자체 시험 실패' }
      - name: 네이티브 쉘 단축키 실측
        if: ${{ !cancelled() }}
        shell: pwsh
        run: |
          ./app/e2e-windows/reset-app-data.ps1
          $env:WEBVIEW2_USER_DATA_FOLDER = Join-Path $env:RUNNER_TEMP 'kaleidoscope-shortcut-webview'
          $env:KALEIDOSCOPE_E2E_OUT = Join-Path $env:GITHUB_WORKSPACE 'windows-e2e/shell-shortcuts'
          New-Item -ItemType Directory -Force $env:KALEIDOSCOPE_E2E_OUT | Out-Null
          $app = Start-Process (Join-Path $env:GITHUB_WORKSPACE 'target/release/kaleidoscope-app.exe') -ArgumentList @('--e2e-scenario=shell-shortcuts', "--e2e-out=$env:KALEIDOSCOPE_E2E_OUT") -RedirectStandardOutput (Join-Path $env:KALEIDOSCOPE_E2E_OUT 'stdout.log') -RedirectStandardError (Join-Path $env:KALEIDOSCOPE_E2E_OUT 'stderr.log') -PassThru
          try {
            $captured = @{}
            $deadline = (Get-Date).AddMinutes(3)
            while ((Get-Date) -lt $deadline) {
              foreach ($surface in @('main','html','sandbox','client','web')) {
                $name = "tab-$surface"
                if ((Test-Path (Join-Path $env:KALEIDOSCOPE_E2E_OUT "$name.request")) -and -not $captured.ContainsKey($name)) {
                  & powershell.exe -NoProfile -ExecutionPolicy Bypass -File ./app/e2e-windows/capture.ps1 (Join-Path $env:KALEIDOSCOPE_E2E_OUT "$name.png")
                  if ($LASTEXITCODE -ne 0) { throw "Windows 전환 화면 캡처 실패: $surface" }
                  New-Item -ItemType File (Join-Path $env:KALEIDOSCOPE_E2E_OUT "$name.done") | Out-Null
                  $captured[$name] = $true
                }
              }
              $app.Refresh()
              if ($app.HasExited) { break }
              Start-Sleep -Milliseconds 100
            }
            $app.Refresh()
            if (-not $app.HasExited) { throw '네이티브 단축키 실측 시간 초과' }
            $events = @(Get-Content (Join-Path $env:KALEIDOSCOPE_E2E_OUT 'events.jsonl') | ForEach-Object { $_ | ConvertFrom-Json })
            Get-Content -Raw (Join-Path $env:KALEIDOSCOPE_E2E_OUT 'shortcut-results.json') | Write-Host
            if ($app.ExitCode -ne 0) { throw "네이티브 단축키 실측 실패: $($app.ExitCode)" }
            foreach ($surface in @('main','html','sandbox','client','web')) {
              foreach ($code in @('ArrowRight','PageDown','Tab')) {
                $rows = @($events | Where-Object { $_.step -eq 'shortcut.measure' -and $_.data.surface -eq $surface -and $_.data.code -eq $code })
                if ($rows.Count -ne 1) { throw "단축키 실측 행 누락/중복: $surface $code" }
                Write-Host ($rows[0].data | ConvertTo-Json -Compress)
                if ($code -ne 'Tab' -and -not $rows[0].data.passed) { throw "단축키 실측 실패: $surface $code" }
              }
            }
            if (@($events | Where-Object { $_.step -eq 'shortcut.other-foreground' -and $_.data.passed }).Count -ne 1) { throw '다른 앱 포커스 검사 누락' }
            if (@($events | Where-Object { $_.step -eq 'complete' -and $_.data.passed }).Count -ne 1) { throw '단축키 실측 완료 누락' }
          } finally {
            Stop-Process -Id $app.Id -Force -ErrorAction SilentlyContinue
          }
      - name: 캡처와 로그 보존
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: windows-webview-e2e
          path: windows-e2e/
          if-no-files-found: warn
