name: Check
on:
  pull_request:
  push:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Check external service names
        run: |
          set +e
          git grep -i -n -E 'soulstream|소울스트림' -- crates app ui
          result=$?
          if [ "$result" -eq 1 ]; then exit 0; fi
          if [ "$result" -eq 0 ]; then exit 1; fi
          exit "$result"

      - name: Check agent vendor names
        run: |
          set +e
          git grep -I -n -i -w -E 'claude|codex|gemini|antigravity|agy' -- crates app ui ':(exclude)**/fixtures/**'
          result=$?
          if [ "$result" -eq 1 ]; then exit 0; fi
          if [ "$result" -eq 0 ]; then exit 1; fi
          exit "$result"

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable

      - name: Test Rust crates
        run: cargo test

      - name: Check generated TypeScript contract
        run: git diff --exit-code -- ui/src/contract

      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
        with:
          version: 10.32.1

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: 변경 내역 스크립트 시험
        run: node --test .github/scripts/release-notes.test.mjs

      - name: 현재 판의 변경 내역 확인
        run: node .github/scripts/release-notes.mjs check

      - name: 화면 CSS 래칫 검사
        run: node scripts/check-ui-css.mjs

      - name: 화면 CSS 검사 스크립트 시험
        run: node --test scripts/check-ui-css.test.mjs

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck workspace packages
        run: pnpm -r --if-present typecheck

      - name: Test workspace packages
        run: pnpm -r --if-present test

  windows-app:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
        with:
          version: 10.32.1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
      - run: pnpm install --frozen-lockfile
      - run: pnpm --dir app build
      - run: cargo check -p kaleidoscope-app
      - run: cargo test -p kaleidoscope-app --lib --features e2e
      - run: cargo test -p kaleidoscope-store-server -- --test-threads=1
      - run: cargo test -p kaleidoscope-core windows_process_cmd_terminates_descendants_in_unicode_cwd -- --test-threads=2
      - run: cargo test -p kaleidoscope-core windows_process_finds_new_user_path_without_restart -- --test-threads=2
      - name: Verify process file URI with a Unicode Windows path
        run: cargo test -p kaleidoscope-core process_file_uri_returns_only_a_window_blob_file_address -- --test-threads=2

  macos-app:
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
        with:
          version: 10.32.1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
      # macOS 러너에서 release 빌드를 매번 처음부터 하지 않도록 캐시한다. 저장은 main push에서만 해서 PR마다 캐시가 늘지 않게 한다.
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          save-if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
      - run: pnpm install --frozen-lockfile
      - run: pnpm --dir app build
      - run: cargo check -p kaleidoscope-app
      - run: cargo test -p kaleidoscope-app --lib
      - name: macOS 앱 번들 빌드
        run: pnpm --dir app tauri build
      - name: 앱 번들 확인
        run: |
          app=target/release/bundle/macos/kaleidoscope.app
          bin="$app/Contents/MacOS/kaleidoscope-app"
          test -d "$app"
          test -x "$bin"
          archs=$(lipo -archs "$bin")
          echo "아키텍처: $archs"
          case " $archs " in
            *" arm64 "*) ;;
            *) echo "arm64 실행 파일이 아닙니다" >&2; exit 1 ;;
          esac
          codesign -dv "$app" || true
      - name: 앱 실행 확인
        run: |
          bin=target/release/bundle/macos/kaleidoscope.app/Contents/MacOS/kaleidoscope-app
          data_dir="$HOME/Library/Application Support/me.eiaserinnys.kaleidoscope"
          token="$data_dir/local-orchestrator.token"
          log="$RUNNER_TEMP/kaleidoscope-app.log"
          "$bin" >"$log" 2>&1 &
          pid=$!
          for _ in $(seq 1 30); do
            if ! kill -0 "$pid" 2>/dev/null; then
              echo "앱이 시작 직후 종료되었습니다" >&2
              cat "$log"
              exit 1
            fi
            if [ -s "$token" ]; then break; fi
            sleep 1
          done
          if [ ! -s "$token" ]; then
            echo "내장 서버 토큰이 만들어지지 않았습니다: $token" >&2
            kill "$pid" 2>/dev/null || true
            cat "$log"
            exit 1
          fi
          sleep 15
          if ! kill -0 "$pid" 2>/dev/null; then
            echo "앱이 실행 중에 종료되었습니다" >&2
            cat "$log"
            exit 1
          fi
          lsof -nP -a -p "$pid" -iTCP -sTCP:LISTEN || true
          port=$(lsof -nP -a -p "$pid" -iTCP@127.0.0.1 -sTCP:LISTEN -Fn | sed -n 's/^n127\.0\.0\.1://p' | head -n 1)
          if [ -z "$port" ]; then
            echo "내장 서버가 127.0.0.1에서 대기하지 않습니다" >&2
            kill "$pid" 2>/dev/null || true
            cat "$log"
            exit 1
          fi
          status=$(curl -s -o /dev/null -w '%{http_code}' "http://127.0.0.1:$port/" || true)
          echo "내장 서버 포트 $port, 응답 $status"
          if [ -z "$status" ] || [ "$status" = "000" ]; then
            echo "내장 서버가 응답하지 않습니다" >&2
            kill "$pid" 2>/dev/null || true
            cat "$log"
            exit 1
          fi
          kill "$pid"
          wait "$pid" 2>/dev/null || true
          cat "$log"
      - name: 앱 번들 압축
        run: ditto -c -k --keepParent target/release/bundle/macos/kaleidoscope.app "$RUNNER_TEMP/kaleidoscope-macos-arm64.zip"
      - name: 앱 번들 올리기
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: kaleidoscope-macos-arm64
          path: ${{ runner.temp }}/kaleidoscope-macos-arm64.zip
          retention-days: 7

  # iPad 앱이 장치용으로 컴파일되는지, 시뮬레이터에서 실행되는지 확인한다.
  # 가장 작은 iPad와 가장 큰 iPad 시뮬레이터 두 대에서 앱을 띄워 앱 장면을 가로 PNG로 찍는다.
  # iPadOS 26은 세로로 든 기기에서 가로 장면을 줄여 검은 바탕 가운데에 그리므로, 화면에서 장면만 잘라 낸다.
  # 서명, 인증서, Apple 계정 시크릿은 쓰지 않는다. TestFlight 업로드는 다음 단위다.
  ios-app:
    runs-on: macos-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
        with:
          version: 10.32.1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          targets: aarch64-apple-ios,aarch64-apple-ios-sim
      # 시뮬레이터 빌드도 매번 처음부터 하지 않도록 캐시한다. 저장은 main push에서만 한다.
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          save-if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
      - run: pnpm install --frozen-lockfile
      - run: pnpm --dir app build
      - name: Xcode 프로젝트 만들기
        run: pnpm --dir app tauri ios init --ci
      - name: 장치용 앱 크레이트 컴파일 확인
        run: cargo check -p kaleidoscope-app --target aarch64-apple-ios
      - name: iPad 시뮬레이터용 앱 빌드
        run: pnpm --dir app tauri ios build --target aarch64-sim --debug --no-sign --ci
      - name: iPad 시뮬레이터 두 대에서 실행하고 화면 찍기
        run: |
          set -euo pipefail
          app=$(ls -d app/src-tauri/gen/apple/build/arm64-sim/*.app | head -n 1)
          test -d "$app"
          echo "앱 번들: $app"
          mkdir -p ios-sim
          python3 - "$app" <<'PY'
          import json
          import pathlib
          import struct
          import subprocess
          import sys
          import tempfile
          import time

          BUNDLE_ID = "me.eiaserinnys.kaleidoscope"
          APP = sys.argv[1]
          OUT = pathlib.Path("ios-sim")


          def rank(name, identifier):
              """iPad 화면 크기 순서. 작을수록 작은 화면이다."""
              text = f"{name} {identifier}".lower()
              if "mini" in text:
                  return 1
              if "13-inch" in text or "12.9-inch" in text:
                  return 5
              if "11-inch" in text:
                  return 3
              if "10." in text or "10th" in text or "9.7" in text or "a16" in text:
                  return 2
              if "air" in text:
                  return 4
              return 3


          def run(*args, check=True):
              return subprocess.run(args, check=check, capture_output=True, text=True)


          def image_size(path):
              values = {}
              for line in run("sips", "-g", "pixelWidth", "-g", "pixelHeight", str(path)).stdout.splitlines():
                  key, _, value = line.strip().partition(":")
                  if key in ("pixelWidth", "pixelHeight"):
                      values[key] = int(value.strip())
              return values["pixelWidth"], values["pixelHeight"]


          RAW = pathlib.Path(tempfile.mkdtemp(prefix="ios-sim-raw-"))


          def read_bmp(path):
              """BMP의 머리와 화소 줄, 색 차례를 읽는다.

              24/32비트, 위/아래 어느 쪽부터 저장해도 읽는다. sips는 32비트에
              BI_BITFIELDS(압축 3)를 쓰므로 그때는 머리의 색 가림값에서 차례를 구한다.
              """
              data = path.read_bytes()
              if data[:2] != b"BM":
                  sys.exit(f"{path}: BMP가 아닙니다")
              offset = struct.unpack_from("<I", data, 10)[0]
              header_size = struct.unpack_from("<I", data, 14)[0]
              width, raw_height = struct.unpack_from("<ii", data, 18)
              planes, bits = struct.unpack_from("<HH", data, 26)
              compression = struct.unpack_from("<I", data, 30)[0]
              if header_size < 40 or planes != 1 or bits not in (24, 32) or compression not in (0, 3):
                  sys.exit(f"{path}: 다루지 않는 BMP입니다(머리 {header_size}, 비트 {bits}, 압축 {compression})")
              if compression == 3 and (bits != 32 or len(data) < 66):
                  sys.exit(f"{path}: 다루지 않는 BMP입니다(비트 {bits}, 압축 {compression})")
              top_down = raw_height < 0
              height = abs(raw_height)
              step = bits // 8
              stride = ((width * step + 3) // 4) * 4
              channels = (0, 1, 2)
              if compression == 3:
                  red, green, blue = struct.unpack_from("<III", data, 54)
                  indexes = []
                  for mask in (blue, green, red):
                      if mask == 0:
                          sys.exit(f"{path}: 색 가림값이 비어 있습니다")
                      indexes.append(((mask & -mask).bit_length() - 1) // 8)
                  if sorted(indexes) != [0, 1, 2]:
                      sys.exit(f"{path}: 이해하지 못하는 색 차례입니다 {tuple(indexes)}")
                  channels = tuple(indexes)

              def line(y):
                  start = offset + (y if top_down else height - 1 - y) * stride
                  if start + width * step > len(data):
                      sys.exit(f"{path}: BMP 화소가 모자랍니다")
                  return data[start:start + width * step]

              return width, height, step, channels, line


          def scene_rect(path):
              """검은 바탕 위에 그려진 앱 장면의 경계를 찾는다.

              simctl에는 기기를 돌리는 명령이 없어 세로로 든 시뮬레이터 화면을 찍게 된다.
              iPadOS 26은 그 화면의 가로 장면을 줄여 가운데에 그리므로 바탕을 걷어 내야 한다.
              """
              width, height, step, channels, line = read_bmp(path)
              bright = bytes(1 if value > 8 else 0 for value in range(256))
              rows = []
              for y in range(height):
                  pixels = line(y)
                  if any(1 in pixels[channel::step].translate(bright) for channel in channels):
                      rows.append(y)
              if not rows:
                  sys.exit(f"{path}: 앱 장면을 찾지 못했습니다")
              top, bottom = rows[0], rows[-1]
              left, right = width, -1
              for y in range(top, bottom + 1):
                  pixels = line(y)
                  for channel in channels:
                      marked = pixels[channel::step].translate(bright)
                      first, last = marked.find(1), marked.rfind(1)
                      if first != -1:
                          left = min(left, first)
                          right = max(right, last)
              if right < left:
                  sys.exit(f"{path}: 앱 장면의 좌우 경계를 찾지 못했습니다")
              return left, top, right - left + 1, bottom - top + 1


          def write_crop(path, source, left, top, width, height):
              """장면 경계만큼 잘라 BMP로 다시 쓴다. 아래 줄부터 저장하는 보통 BMP다."""
              _, _, step, channels, line = read_bmp(source)
              stride = ((width * step + 3) // 4) * 4
              rows = []
              for y in range(top, top + height):
                  source_row = line(y)[left * step:(left + width) * step]
                  if channels != (0, 1, 2):
                      ordered = bytearray(width * step)
                      for position, channel in enumerate(channels):
                          ordered[position::step] = source_row[channel::step]
                      source_row = bytes(ordered)
                  pixels = bytearray(source_row)
                  if step == 4:
                      # 알파가 0으로 저장돼 있어도 PNG에서 투명해지지 않게 채운다.
                      pixels[3::4] = b"\xff" * width
                  rows.append(bytes(pixels) + b"\x00" * (stride - len(pixels)))
              header = (
                  b"BM"
                  + struct.pack("<IHHI", 54 + stride * height, 0, 0, 54)
                  + struct.pack("<IiiHHIIiiII", 40, width, height, 1, step * 8, 0, stride * height, 2835, 2835, 0, 0)
              )
              with open(path, "wb") as output:
                  output.write(header)
                  for row in reversed(rows):
                      output.write(row)


          def capture(device, filename):
              _, name, udid, _ = device
              run("xcrun", "simctl", "boot", udid, check=False)
              run("xcrun", "simctl", "bootstatus", udid, "-b")
              run("xcrun", "simctl", "install", udid, APP)
              run("xcrun", "simctl", "launch", udid, BUNDLE_ID)
              time.sleep(25)
              listing = run("xcrun", "simctl", "spawn", udid, "launchctl", "list", check=False).stdout
              if BUNDLE_ID not in listing:
                  logs = run("xcrun", "simctl", "spawn", udid, "log", "show", "--last", "3m", "--style", "compact",
                             "--predicate", 'processImagePath CONTAINS "kaleidoscope"', check=False).stdout
                  print(logs[-8000:], file=sys.stderr)
                  sys.exit(f"{name}: 앱이 실행 중에 종료되었습니다")
              shot = RAW / f"{filename}.png"
              run("xcrun", "simctl", "io", udid, "screenshot", str(shot))
              bmp = RAW / f"{filename}.bmp"
              run("sips", "-s", "format", "bmp", str(shot), "--out", str(bmp))
              left, top, scene_width, scene_height = scene_rect(bmp)
              scene = RAW / f"{filename}-scene.bmp"
              write_crop(scene, bmp, left, top, scene_width, scene_height)
              if scene_width < scene_height:
                  # 세로 틀에 장면이 돌아간 채 찍히면 돌려서 가로로 만든다.
                  rotated = RAW / f"{filename}-rotated.bmp"
                  run("sips", "-r", "90", str(scene), "--out", str(rotated))
                  scene = rotated
              path = OUT / filename
              run("sips", "-s", "format", "png", str(scene), "--out", str(path))
              width, height = image_size(path)
              if width <= height:
                  sys.exit(f"{filename}: 가로 PNG가 아닙니다({width}x{height})")
              print(f"{filename}: {name} {width}x{height} (장면 {scene_width}x{scene_height} at {left},{top})", flush=True)


          raw = json.loads(run("xcrun", "simctl", "list", "devices", "available", "-j").stdout)
          devices = []
          for runtime, entries in raw["devices"].items():
              for entry in entries:
                  if entry.get("isAvailable") and "iPad" in entry.get("name", ""):
                      devices.append((rank(entry["name"], entry.get("deviceTypeIdentifier", "")), entry["name"], entry["udid"], runtime))
          if not devices:
              sys.exit("iPad 시뮬레이터를 찾지 못했습니다")
          devices.sort(key=lambda item: item[0])
          small, large = devices[0], devices[-1]
          print("가장 작은 iPad:", small[1], small[2])
          print("가장 큰 iPad:", large[1], large[2])
          if small[2] == large[2]:
              sys.exit("크기가 다른 iPad 시뮬레이터가 둘 이상 필요합니다:\n" + "\n".join(f"- {item[1]}" for item in devices))
          capture(small, "ipad-small.png")
          capture(large, "ipad-large.png")
          PY
          ls -l ios-sim
      - name: 시뮬레이터 화면 올리기
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: kaleidoscope-ios-simulator
          path: ios-sim/*.png
          retention-days: 7
