name: Check
on:
  pull_request:
  push:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Check external service names
        run: |
          set +e
          git grep -i -n -E 'soulstream|소울스트림' -- crates app ui
          result=$?
          if [ "$result" -eq 1 ]; then exit 0; fi
          if [ "$result" -eq 0 ]; then exit 1; fi
          exit "$result"

      - name: Check agent vendor names
        run: |
          set +e
          git grep -I -n -i -w -E 'claude|codex|gemini|antigravity|agy' -- crates app ui ':(exclude)**/fixtures/**'
          result=$?
          if [ "$result" -eq 1 ]; then exit 0; fi
          if [ "$result" -eq 0 ]; then exit 1; fi
          exit "$result"

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable

      - name: Test Rust crates
        run: cargo test

      - name: Check generated TypeScript contract
        run: git diff --exit-code -- ui/src/contract

      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
        with:
          version: 10.32.1

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck workspace packages
        run: pnpm -r --if-present typecheck

      - name: Test workspace packages
        run: pnpm -r --if-present test

  windows-app:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
        with:
          version: 10.32.1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
      - run: pnpm install --frozen-lockfile
      - run: pnpm --dir app build
      - run: cargo check -p kaleidoscope-app
      - run: cargo test -p kaleidoscope-app --lib
