name: Release kaleidoscope
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
        with:
          version: 10.32.1

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - uses: tauri-apps/tauri-action@fce9c6108b31ea247710505d3aaaa893ee6768d4 # v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: app
          tauriScript: pnpm tauri
          tagName: ${{ github.ref_name }}
          releaseName: 'kaleidoscope ${{ github.ref_name }}'
          releaseBody: 'See the assets below to download this version.'
          prerelease: ${{ contains(github.ref_name, '-') }}

      - name: Capture Windows shell smoke screen
        shell: pwsh
        run: |
          $exe = Join-Path $env:GITHUB_WORKSPACE "target/release/kaleidoscope-app.exe"
          if (-not (Test-Path $exe)) { throw "Release executable not found: $exe" }

          $app = Start-Process -FilePath $exe -PassThru
          try {
            Start-Sleep -Seconds 15
            $captureScript = @'
          Add-Type -AssemblyName System.Drawing
          Add-Type -AssemblyName System.Windows.Forms
          $bounds = [System.Windows.Forms.SystemInformation]::VirtualScreen
          $bitmap = New-Object System.Drawing.Bitmap($bounds.Width, $bounds.Height)
          $graphics = [System.Drawing.Graphics]::FromImage($bitmap)
          try {
            $graphics.CopyFromScreen($bounds.X, $bounds.Y, 0, 0, $bounds.Size)
            $bitmap.Save((Join-Path $env:GITHUB_WORKSPACE "smoke.png"), [System.Drawing.Imaging.ImageFormat]::Png)
          }
          finally {
            $graphics.Dispose()
            $bitmap.Dispose()
          }
          '@
            $capturePath = Join-Path $env:RUNNER_TEMP "capture-smoke.ps1"
            Set-Content -Path $capturePath -Value $captureScript -Encoding utf8
            $capture = Start-Process -FilePath "powershell.exe" -ArgumentList @(
              "-NoProfile", "-ExecutionPolicy", "Bypass", "-File", $capturePath
            ) -PassThru -Wait
            if ($capture.ExitCode -ne 0) { throw "Screen capture failed with exit code $($capture.ExitCode)" }
            if (-not (Test-Path (Join-Path $env:GITHUB_WORKSPACE "smoke.png"))) { throw "smoke.png was not created" }
          }
          finally {
            Stop-Process -Id $app.Id -Force -ErrorAction SilentlyContinue
          }

      - name: Upload Windows shell smoke screen
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: windows-smoke-${{ github.ref_name }}
          path: smoke.png
          if-no-files-found: error

      - name: Upload example app definitions
        run: gh release upload "${{ github.ref_name }}" examples/md-editor.json examples/md-viewer.json --clobber
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
