name: Release kaleidoscope
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
        with:
          version: 10.32.1

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: 릴리스 변경 내역 확인
        if: ${{ !contains(github.ref_name, '-') }}
        shell: pwsh
        run: |
          $version = '${{ github.ref_name }}'.Substring(1)
          node .github/scripts/release-notes.mjs check --version $version
          if ($LASTEXITCODE -ne 0) { throw '릴리스 변경 내역 확인 실패' }

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - uses: tauri-apps/tauri-action@fce9c6108b31ea247710505d3aaaa893ee6768d4 # v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: app
          tauriScript: pnpm tauri
          tagName: ${{ github.ref_name }}
          releaseName: 'kaleidoscope ${{ github.ref_name }}'
          releaseBody: 'See the assets below to download this version.'
          prerelease: ${{ contains(github.ref_name, '-') }}

      - name: 독립 서버 빌드와 릴리스 업로드
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cargo build --release -p kaleidoscope-orchestrator --target x86_64-pc-windows-msvc
          if ($LASTEXITCODE -ne 0) { throw '독립 서버 빌드 실패' }
          Copy-Item target/x86_64-pc-windows-msvc/release/kaleidoscope-orchestrator.exe kaleidoscope-orchestrator-x86_64-pc-windows-msvc.exe
          New-Item -ItemType Directory -Force standalone-server/apps | Out-Null
          Copy-Item kaleidoscope-orchestrator-x86_64-pc-windows-msvc.exe standalone-server/
          Copy-Item apps/*.json standalone-server/apps/
          Compress-Archive -Path standalone-server/* -DestinationPath kaleidoscope-orchestrator-x86_64-pc-windows-msvc.zip
          gh release upload '${{ github.ref_name }}' kaleidoscope-orchestrator-x86_64-pc-windows-msvc.exe kaleidoscope-orchestrator-x86_64-pc-windows-msvc.zip --clobber
          if ($LASTEXITCODE -ne 0) { throw '독립 서버 업로드 실패' }

      - name: 설치본과 서명 자산 확인
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $version = '${{ github.ref_name }}'.Substring(1)
          $installer = "kaleidoscope_${version}_x64-setup.exe"
          $release = gh release view '${{ github.ref_name }}' --json assets | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0) { throw '릴리스 자산 조회 실패' }
          $names = @($release.assets | ForEach-Object { $_.name })
          if ($installer -notin $names -or "$installer.sig" -notin $names) { throw '설치본 또는 서명 자산이 없습니다' }

      - name: R2에 설치본과 업데이트 매니페스트 올리기
        if: ${{ !contains(github.ref_name, '-') }}
        shell: pwsh
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_BUCKET: ${{ vars.R2_BUCKET }}
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
        run: |
          $ErrorActionPreference = 'Stop'
          $version = '${{ github.ref_name }}'.Substring(1)
          $installer = "kaleidoscope_${version}_x64-setup.exe"
          $installerPath = Join-Path $env:GITHUB_WORKSPACE "target/release/bundle/nsis/$installer"
          $signaturePath = "$installerPath.sig"
          $manifestPath = Join-Path $env:RUNNER_TEMP 'latest.json'
          $changesPath = Join-Path $env:RUNNER_TEMP 'changes.json'
          $publicBase = 'https://kaleidoscope.eiaserinnys.me/releases'
          $versionedKey = "releases/v$version/$installer"
          $endpoint = "https://$env:R2_ACCOUNT_ID.r2.cloudflarestorage.com"
          node .github/scripts/release-notes.mjs changes --version $version --out $changesPath
          if ($LASTEXITCODE -ne 0) { throw '릴리스 변경 내역 생성 실패' }
          & ./.github/scripts/write-update-manifest.ps1 -Version $version -SignaturePath $signaturePath -ChangesPath $changesPath -Url "$publicBase/v$version/$installer" -OutFile $manifestPath

          aws s3 cp $installerPath "s3://$env:R2_BUCKET/$versionedKey" --endpoint-url $endpoint --region auto --content-type 'application/octet-stream' --cache-control 'public, max-age=31536000, immutable'
          if ($LASTEXITCODE -ne 0) { throw 'R2 판별 설치본 업로드 실패' }
          aws s3 cp $signaturePath "s3://$env:R2_BUCKET/$versionedKey.sig" --endpoint-url $endpoint --region auto --content-type 'text/plain; charset=utf-8' --cache-control 'public, max-age=31536000, immutable'
          if ($LASTEXITCODE -ne 0) { throw 'R2 판별 서명 업로드 실패' }
          aws s3 cp $installerPath "s3://$env:R2_BUCKET/releases/kaleidoscope_x64-setup.exe" --endpoint-url $endpoint --region auto --content-type 'application/octet-stream' --cache-control 'public, max-age=60'
          if ($LASTEXITCODE -ne 0) { throw 'R2 고정 설치본 업로드 실패' }
          aws s3 cp $manifestPath "s3://$env:R2_BUCKET/releases/latest.json" --endpoint-url $endpoint --region auto --content-type 'application/json' --cache-control 'public, max-age=60'
          if ($LASTEXITCODE -ne 0) { throw 'R2 업데이트 매니페스트 업로드 실패' }

          $published = Invoke-RestMethod -Uri "$publicBase/latest.json?run=${{ github.run_id }}"
          if ($published.version -ne $version) { throw '공개 업데이트 매니페스트의 판이 다릅니다' }
          if ($published.changes[0].version -ne $version) { throw '공개 변경 내역의 첫 판이 다릅니다' }
          $downloaded = Join-Path $env:RUNNER_TEMP 'published-setup.exe'
          Invoke-WebRequest -Uri "$publicBase/kaleidoscope_x64-setup.exe?run=${{ github.run_id }}" -OutFile $downloaded
          if ((Get-FileHash -Algorithm SHA256 $downloaded).Hash -ne (Get-FileHash -Algorithm SHA256 $installerPath).Hash) { throw '공개 설치본이 올린 파일과 다릅니다' }

      - name: Capture Windows shell smoke screen
        shell: pwsh
        run: |
          $exe = Join-Path $env:GITHUB_WORKSPACE "target/release/kaleidoscope-app.exe"
          if (-not (Test-Path $exe)) { throw "Release executable not found: $exe" }

          $app = Start-Process -FilePath $exe -PassThru
          try {
            Start-Sleep -Seconds 15
            $captureScript = @'
          Add-Type -AssemblyName System.Drawing
          Add-Type -AssemblyName System.Windows.Forms
          $bounds = [System.Windows.Forms.SystemInformation]::VirtualScreen
          $bitmap = New-Object System.Drawing.Bitmap($bounds.Width, $bounds.Height)
          $graphics = [System.Drawing.Graphics]::FromImage($bitmap)
          try {
            $graphics.CopyFromScreen($bounds.X, $bounds.Y, 0, 0, $bounds.Size)
            $bitmap.Save((Join-Path $env:GITHUB_WORKSPACE "smoke.png"), [System.Drawing.Imaging.ImageFormat]::Png)
          }
          finally {
            $graphics.Dispose()
            $bitmap.Dispose()
          }
          '@
            $capturePath = Join-Path $env:RUNNER_TEMP "capture-smoke.ps1"
            Set-Content -Path $capturePath -Value $captureScript -Encoding utf8
            $capture = Start-Process -FilePath "powershell.exe" -ArgumentList @(
              "-NoProfile", "-ExecutionPolicy", "Bypass", "-File", $capturePath
            ) -WindowStyle Hidden -PassThru -Wait
            if ($capture.ExitCode -ne 0) { throw "Screen capture failed with exit code $($capture.ExitCode)" }
            if (-not (Test-Path (Join-Path $env:GITHUB_WORKSPACE "smoke.png"))) { throw "smoke.png was not created" }
          }
          finally {
            Stop-Process -Id $app.Id -Force -ErrorAction SilentlyContinue
          }

      - name: Upload Windows shell smoke screen
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: windows-smoke-${{ github.ref_name }}
          path: smoke.png
          if-no-files-found: error
